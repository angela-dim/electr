[project]
name = "electr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "angela-dim", email = "ang.a.dimitrova@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.1.1",
]

[project.scripts]
electr = "electr:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
